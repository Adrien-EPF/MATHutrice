name: CI

on:
  push:
  pull_request:

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run tach check
      - run: uv run python scripts/check_cycles.py

  # On a push to the deployed branch alone, once every job above has passed.
  deploy-staging:
    name: deploy to staging
    needs: [architecture]
    if: github.event_name == 'push' && github.ref == 'refs/heads/course-2026-fallback-clean-bench'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One deploy at a time: a newer push waits for the one running.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7

      # One image per commit, tagged with it, so whatever runs can be traced to
      # the run that passed. A commit pushed twice is built once.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Written at every deploy, so the GitHub Environment stays the one place
      # a setting is changed. --output none: the command would otherwise print
      # every setting back, secrets included.
      # - WEBSITES_PORT: uvicorn listens on 8000, not on the 80 App Service expects.
      # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false: the SQLite file stays on the
      #   container's own disk, where it can take its locks. It is created and
      #   seeded again at every start.
      - name: Write this environment's settings
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
            --settings \
              AUTH_MODE=dev \
              WEBSITES_PORT=8000 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
              DATABASE_URL=sqlite:///./mathutrice.db \
              LLM_BASE_URL=https://api.mistral.ai/v1 \
              LLM_MODEL=ministral-14b-latest \
              "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
              "SESSION_SECRET=$SESSION_SECRET" \
              "LLM_API_KEY=$LLM_API_KEY"

      # The image is public on GHCR, so the app pulls it without credentials.
      - name: Run the image
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
            --container-image-name "$IMAGE"
          running=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
          if [ "$running" != "DOCKER|$IMAGE" ]; then
            echo "$APP_NAME is set to $running, not $IMAGE" >&2
            exit 1
          fi
          echo "$APP_NAME now runs $IMAGE"

      # Pulling the image is most of the wait, so allow 10 minutes. A 200 from
      # the new container's own sign-in page; the job fails if it never comes.
      - name: Wait until the app answers
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          url="https://$APP_NAME.azurewebsites.net/dev/login"
          limit=600
          start=$(date +%s)
          while true; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            elapsed=$(( $(date +%s) - start ))
            if [ "$code" = 200 ]; then
              echo "$url answers 200, ${elapsed} s after the image was set"
              exit 0
            fi
            echo "${elapsed} s: $url answered ${code:-nothing}"
            if [ "$elapsed" -ge "$limit" ]; then
              echo "$url did not answer 200 within $limit s" >&2
              exit 1
            fi
            sleep 15
          done
